<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>zero-to dev: overlay</title>
    <style>
      html {
        background: #05070b;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        color: #eef0f2;
      }
      /* The stand-in for the scene: a drawn backdrop, or a picture of the real one. */
      #backdrop,
      #picture {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #picture {
        object-fit: cover;
      }
      #picture[hidden] {
        display: none;
      }
      /* The stand-in for the outline of the list view. The real one belongs to the outline package. */
      #zt-outline {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        padding: 110px max(16px, calc(50vw - 340px)) 220px;
        overflow: auto;
        background: #0b0f17;
        font: 16px/1.5 'Atkinson Hyperlegible Next', system-ui, sans-serif;
        color: #a9b2bf;
      }
      #zt-outline h1 {
        margin: 0 0 12px;
        font: 500 34px/1.1 'Fraunces', Georgia, serif;
        color: #eef0f2;
      }
      #zt-outline h2 {
        margin: 28px 0 6px;
        font: 500 22px/1.2 'Fraunces', Georgia, serif;
        color: #eef0f2;
      }
      #zt-outline ol {
        margin: 0;
        padding-left: 22px;
      }
      /* Dev controls hang where the section tabs will hang. They are not part of the overlay. */
      .dev-strip {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 0 0 8px 8px;
        background: rgb(20 27 39 / 0.86);
        font: 11px/1 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color: #a9b2bf;
        white-space: nowrap;
      }
      .dev-strip button {
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid rgb(238 240 242 / 0.25);
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .dev-strip button[aria-pressed='true'] {
        border-color: #ffd9a0;
        color: #ffd9a0;
      }
      .dev-strip input[type='range'] {
        width: 150px;
      }
      body.still .dev-strip {
        display: none;
      }
      @media (max-width: 900px) {
        .dev-strip {
          position: fixed;
          top: 62px;
        }
        .dev-strip input[type='range'] {
          width: 90px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <img id="picture" alt="" hidden />
    <main id="zt-outline" hidden></main>
    <div id="hud"></div>
    <script type="module" src="./hud.ts"></script>
  </body>
</html>
