<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zero-to dev: record</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f17;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* A dark foot under the caption, so the words read over paper as well as over wood. */
      body.captioned::after {
        content: '';
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 180px;
        background: linear-gradient(to bottom, rgba(5, 7, 11, 0), rgba(5, 7, 11, 0.84) 58%, rgba(5, 7, 11, 0.94));
        pointer-events: none;
      }
      #caption {
        z-index: 1;
        position: fixed;
        left: 34px;
        bottom: 24px;
        margin: 0;
        pointer-events: none;
        color: #f3ece0;
        text-shadow: 0 1px 10px rgba(5, 7, 11, 0.9);
      }
      #caption[hidden] {
        display: none;
      }
      #caption .name {
        font: 600 30px/1.15 'Fraunces', Georgia, serif;
        letter-spacing: 0.005em;
      }
      #caption .spec {
        margin-top: 7px;
        font: 500 16px/1.4 'IBM Plex Mono', ui-monospace, Consolas, monospace;
        color: #c3cad6;
        white-space: pre;
      }
      #count {
        z-index: 1;
        position: fixed;
        right: 34px;
        bottom: 26px;
        font: 500 16px/1.4 'IBM Plex Mono', ui-monospace, Consolas, monospace;
        color: #8a94a3;
        pointer-events: none;
      }
      #count[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="caption" hidden>
      <div class="name"></div>
      <div class="spec"></div>
    </div>
    <div id="count" hidden></div>
    <script type="module" src="./record.ts"></script>
  </body>
</html>
